; https://docs.platformio.org/page/projectconf.html

[env:frdm_kl25z]
; Pin explícito: `platform = freescalekinetis` sem versão sempre
; resolve pra última publicada no registry. Até aqui isso "funcionava
; por acidente" porque a última versão disponível, na prática,
; continuava sendo a que builda este código (framework-zephyr
; ~2.20701.0, Zephyr 2.7.1, API antiga #include <zephyr.h>). Isso
; parou de ser verdade em 31/08/2026: freescalekinetis@11.0.0 foi
; publicado e pina framework-zephyr ~3.40402.0 (Zephyr 4.4.2), que
; exige #include <zephyr/...> — não é regressão de instalação (uv ou
; outra), é o registry avançando por baixo de um pin ausente. 10.0.0
; é a última versão que pina o Zephyr 2.7.1 que este código usa.
platform = freescalekinetis@10.0.0
board = frdm_kl25z
framework = zephyr
; boards/frdm_kl25z.overlay é auto-descoberto pelo boilerplate.cmake do
; Zephyr (zephyr_file(CONF_FILES ${APPLICATION_SOURCE_DIR}/boards ...))
; DESDE QUE o overlay esteja dentro de zephyr/boards/ (não na raiz do
; projeto) — não precisa de opção alguma aqui.

; nrf24, spi, motor, ultrassom, encoder, odometria são compartilhados
; entre Carrinho e Controle — ver lib/SPEC.md na raiz do repo.
; projeto_final/ fica um nível mais raso que experiências/Exp*/, por
; isso ../../lib aqui (não ../../../lib como em Exp2/Exp4).
lib_extra_dirs = ../../lib

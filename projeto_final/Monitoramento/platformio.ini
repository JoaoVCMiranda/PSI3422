; https://docs.platformio.org/page/projectconf.html

[env:frdm_kl25z]
; Pin explícito — ver o mesmo comentário em ../Carrinho/platformio.ini:
; sem versão, `platform = freescalekinetis` resolve pra última do
; registry, que desde 31/08/2026 (11.0.0) pina framework-zephyr
; ~3.40402.0 (Zephyr 4.4.2, #include <zephyr/...>) e quebra todo o
; código deste repo (API antiga, #include <zephyr.h>). 10.0.0 é a
; última versão que pina framework-zephyr ~2.20701.0 (Zephyr 2.7.1).
platform = freescalekinetis@10.0.0
board = frdm_kl25z
framework = zephyr
; boards/frdm_kl25z.overlay é auto-descoberto pelo boilerplate.cmake do
; Zephyr (zephyr_file(CONF_FILES ${APPLICATION_SOURCE_DIR}/boards ...))
; DESDE QUE o overlay esteja dentro de zephyr/boards/ (não na raiz do
; projeto) — não precisa de opção alguma aqui.

; nrf24, spi são compartilhados entre Carrinho/Controle/Monitoramento —
; ver lib/SPEC.md na raiz do repo. projeto_final/ fica um nível mais
; raso que experiências/Exp*/, por isso ../../lib aqui (não
; ../../../lib como em Exp2/Exp4).
lib_extra_dirs = ../../lib
